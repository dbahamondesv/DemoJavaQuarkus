quarkus:
  banner:
    enabled: false
  datasource:
    devservices:
      enabled: false  # Deshabilitamos devservices ya que tenemos BD externa
  flyway:
    migrate-at-start: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-on-validation-error: true  # Solo en desarrollo
  hibernate-orm:
    database:
      generation: none

"%dev":
  quarkus:
    log:
      level: DEBUG
    debug:
      port: 5005
      suspend: false

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: Employee API
          version: 0.0.1
          description: REST API for employees data
